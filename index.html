<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Tema: aplica modo oscuro antes de pintar, para evitar un destello blanco ── -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var dark = stored ? stored === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>

    <!-- ── Favicon ── -->
    <link rel="icon" type="image/png" sizes="48x48" href="/src/assets/icon/favicon.png" />

    <!-- ── Fuentes ── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap"
      rel="stylesheet"
    />

    <!-- ── SEO primario ── -->
    <title>Leticia Aranda | Desarrolladora Frontend</title>
    <meta
      name="description"
      content="Portafolio de Leticia Aranda — Desarrolladora Frontend especializada en React, Next.js y TypeScript. Construyo productos web modernos, accesibles y con diseño centrado en el usuario."
    />
    <meta name="author" content="Leticia Aranda" />
    <meta name="keywords" content="desarrolladora frontend, frontend developer, React, Next.js, TypeScript, UI/UX, portafolio" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://portfolio-leticiaranda.vercel.app" />

    <!-- ── Open Graph (LinkedIn, Facebook, WhatsApp) ── -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://portfolio-leticiaranda.vercel.app" />
    <meta property="og:title" content="Leticia Aranda | Desarrolladora Frontend" />
    <meta
      property="og:description"
      content="Portafolio de Leticia Aranda — Desarrolladora Frontend especializada en React, Next.js y TypeScript. Productos web modernos y cuidados en cada detalle."
    />
    <meta property="og:image" content="https://portfolio-leticiaranda.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Leticia Aranda — Desarrolladora Frontend" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:site_name" content="Leticia Aranda Portfolio" />

    <!-- ── Twitter / X Card ── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Leticia Aranda | Desarrolladora Frontend" />
    <meta
      name="twitter:description"
      content="Portafolio de Leticia Aranda — Desarrolladora Frontend especializada en React, Next.js y TypeScript."
    />
    <meta name="twitter:image" content="https://portfolio-leticiaranda.vercel.app/og-image.png" />
    <meta name="twitter:image:alt" content="Leticia Aranda — Desarrolladora Frontend" />
  </head>
  <body class="intro">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
