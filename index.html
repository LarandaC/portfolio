<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Favicon ── -->
    <link rel="icon" type="image/png" sizes="32x32" href="/src/assets/icon/icon-2.png" />

    <!-- ── Fuentes ── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />

    <!-- ── SEO primario ── -->
    <title>Leticia Aranda | Desarrolladora Full Stack</title>
    <meta
      name="description"
      content="Portafolio de Leticia Aranda — Desarrolladora Full Stack especializada en React, TypeScript y Node.js. Creando aplicaciones web modernas, escalables y con diseño centrado en el usuario."
    />
    <meta name="author" content="Leticia Aranda" />
    <meta name="keywords" content="desarrolladora full stack, React, TypeScript, Node.js, portafolio, frontend, backend, UI/UX" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://portfolio-leticiaranda.vercel.app" />

    <!-- ── Open Graph (LinkedIn, Facebook, WhatsApp) ── -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://portfolio-leticiaranda.vercel.app" />
    <meta property="og:title" content="Leticia Aranda | Desarrolladora Full Stack" />
    <meta
      property="og:description"
      content="Portafolio de Leticia Aranda — Desarrolladora Full Stack especializada en React, TypeScript y Node.js. Creando aplicaciones web modernas y escalables."
    />
    <meta property="og:image" content="https://portfolio-leticiaranda.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Leticia Aranda — Desarrolladora Full Stack" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:site_name" content="Leticia Aranda Portfolio" />

    <!-- ── Twitter / X Card ── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Leticia Aranda | Desarrolladora Full Stack" />
    <meta
      name="twitter:description"
      content="Portafolio de Leticia Aranda — Desarrolladora Full Stack especializada en React, TypeScript y Node.js."
    />
    <meta name="twitter:image" content="https://portfolio-leticiaranda.vercel.app/og-image.png" />
    <meta name="twitter:image:alt" content="Leticia Aranda — Desarrolladora Full Stack" />
    <script>
      (function () {
        var stored = localStorage.getItem("theme");
        var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        var theme = stored === "dark" || stored === "light" ? stored : prefersDark ? "dark" : "light";
        document.documentElement.classList.add(theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="modal-root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
